<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">LiveWall for macOS</title>
  <desc id="desc">A vivid desktop wallpaper running beneath macOS desktop icons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070512"/><stop offset=".5" stop-color="#15102b"/><stop offset="1" stop-color="#071d2e"/>
    </linearGradient>
    <radialGradient id="aurora" cx="72%" cy="20%" r="78%">
      <stop stop-color="#7CE0F5" stop-opacity=".92"/><stop offset=".34" stop-color="#6D65EB" stop-opacity=".66"/><stop offset=".72" stop-color="#FF5C8A" stop-opacity=".18"/><stop offset="1" stop-color="#08070E" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="48"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".46"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="870" cy="120" rx="500" ry="230" fill="url(#aurora)" filter="url(#blur)"/>
  <path d="M-40 565C188 355 350 618 570 420s386-139 670-332v600H-40Z" fill="#35D6FF" opacity=".12"/>
  <path d="M-20 590c242-196 423 4 614-189s344-147 640-313" fill="none" stroke="#6BF0B4" stroke-opacity=".5" stroke-width="3"/>
  <path d="M-20 626c242-196 423 4 614-189s344-147 640-313" fill="none" stroke="#FF5C8A" stroke-opacity=".38" stroke-width="3" transform="translate(0 9)"/>
  <g filter="url(#shadow)">
    <rect x="700" y="114" width="405" height="314" rx="20" fill="#11101D" fill-opacity=".68" stroke="#ffffff" stroke-opacity=".2"/>
    <rect x="700" y="114" width="405" height="27" rx="20" fill="#ffffff" fill-opacity=".09"/>
    <circle cx="727" cy="128" r="5" fill="#FF5F57"/><circle cx="745" cy="128" r="5" fill="#FEBC2E"/><circle cx="763" cy="128" r="5" fill="#28C840"/>
    <text x="793" y="133" fill="#EDEBFA" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="600">LiveWall · 正在运行</text>
    <rect x="730" y="167" width="345" height="200" rx="13" fill="#0b1730"/>
    <circle cx="964" cy="225" r="142" fill="#35D6FF" opacity=".3" filter="url(#blur)"/>
    <path d="M730 342c68-108 115 21 194-74s107-41 151-102v201H730Z" fill="#8A63E9" opacity=".58"/>
    <g fill="#fff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" text-anchor="middle">
      <g transform="translate(1024 187)"><path d="M0 8 8 2h15l4 5h17v23H0Z" fill="#65B4F7"/><text y="43">项目</text></g>
      <g transform="translate(1020 271)"><path d="M2 0h23l11 11v31H2Z" fill="#F3F0FB"/><text x="18" y="50">说明.txt</text></g>
    </g>
  </g>
  <g fill="#fff">
    <text x="92" y="206" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="26" font-weight="600" letter-spacing="5" opacity=".72">LIVEWALL / macOS</text>
    <text x="88" y="304" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="78" font-weight="720" letter-spacing="-4">让桌面活过来。</text>
    <text x="94" y="360" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="25" opacity=".78">视频 · WebGL · 分层视差 · 原生省电</text>
  </g>
  <g transform="translate(94 444)">
    <rect width="222" height="45" rx="22.5" fill="#fff"/>
    <circle cx="24" cy="22.5" r="6" fill="#6BF0B4"/>
    <text x="43" y="29" fill="#090613" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="17" font-weight="650">桌面图标之下</text>
  </g>
